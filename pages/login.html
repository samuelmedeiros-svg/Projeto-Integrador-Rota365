    <title>Rota365</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">


    <link rel="stylesheet" href="../assets/css/header.css">
    <link rel="stylesheet" href="../assets/css/card.css">
    <link rel="stylesheet" href="../assets/css/index.css">
    <link rel="stylesheet" href="../assets/css/login.css">
</head>

<body>
  

  <header id="header">
      <div class="container">
          <div class="logo">
          <a href="index.html">
              <img src="assets/images/logo.png" alt="logo" width="150" id="logo">
          </a>
          </div>
          <nav>
              <a href="index.html">Início</a>
              <a href="pages/frota.html">Frota365</a>
              <a href="#">365hub</a>
              <a href="#">Reservas</a>
              <a href="#">Contato</a>
              <a href="#">Ajuda</a>
          </nav>
          <div class="profile">
              <a href="#" data-bs-toggle="modal" data-bs-target="#loginModal">
                  <img src="../assets/images/profile.png" alt="profile" id="profile">
              </a>
          </div>
          <div class="lupa">
              <a href="#">
                  <img src="../assets/images/lupa.png" alt="lupa" id="lupa">
              </a>
          </div>
      </div>
  </header>

    <div class="modal fade" id="loginModal" tabindex="-1" aria-label="loginModallabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered w-75">
        <div class="modal-content">
            <div class="modal-body">
              <img src="../assets/images/logo.png" alt="logo" class="modal-img">
              <form>
                <div class="mb-3">
                  <label for="InputEmail1" class="form-label">Email</label>
                  <input type="email" class="form-control" id="InputEmail1" aria-describedby="emailHelp" placeholder="seuemail@aqui.com">
                </div>
                <div class="mb-2">
                    <label for="InputPassword1" class="form-label">Senha</label>
                    <input type="password" class="form-control white-text" id="InputPassword1" placeholder="sua senha aqui">
                </div>
                <div class="leva-senha mb-2">
                    <button type="button" id="levasenha-btn"class="btn btn-link btn-sm p-0" data-bs-toggle="modal" data-bs-target="#trocarsenhaModal">Esqueci minha senha</button> 
                </div>
                
                <button id="entrar-btn" type="submit" class="btn btn-sm mb-2">Entrar</button>
                <div class="leva-cadastro"> 
                    <button type="button" id="levacadastro-btn" class="btn btn-link btn-sm p-0" data-bs-target="#cadastroModal" data-bs-toggle="modal">Crie sua conta</button>
                </div>  
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>

     <div class="modal fade" id="trocarsenhaModal"  aria-label="trocarsenhaModallabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered w-75">
        <div class="modal-content">
            <div class="modal-body">
              <img src="../assets/images/logo-login.png" alt="logo" class="modal-img">
              <form>
                <div class="mb-3">
                    <label for="InputNewPassword" class="form-label">Nova Senha</label>
                    <input type="password" class="form-control white-text" id="InputNewPassword" placeholder="sua nova senha aqui">
                </div>

                <div class="mb-4">
                    <label for="RepeteInputPassword" class="form-label">Repita sua nova senha</label>
                    <input type="password" class="form-control white-text" id="RepeteInputPassword" placeholder="repita sua senha aqui">
                </div>
                          
                <button id="entrar-btn" type="submit" class="btn btn-sm mb-2">Trocar Senha</button>
                <div class="leva-cadastro"> 
                    <button type="button" id="levacadastro-btn" class="btn btn-link btn-sm p-0" data-bs-target="#cadastroModal" data-bs-toggle="modal">Crie sua conta</button>
                </div>  
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
    
    <div class="modal fade" id="cadastroModal" aria-label="cadastroModallabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered w-75">
        <div class="modal-content">
            <div class="modal-body">
              <img src="../assets/images/logo-login.png" alt="logo" class="modal-img">
              <form>
                <div class="mb-3">
                  <label for="InputEmail1" class="form-label">Email</label>
                  <input type="email" class="form-control" id="InputEmail1" aria-describedby="emailHelp" placeholder="seuemail@aqui.com">
                </div>

                <div class="mb-3">
                    <label for="InputNewPassword" class="form-label">Senha</label>
                    <input type="password" class="form-control white-text" id="InputNewPassword" placeholder="sua nova senha aqui">
                </div>

                <div class="mb-4">
                    <label for="InputTel" class="form-label">Seu Telefone</label>
                    <input type="text" class="form-control white-text" id="InputTel" placeholder="(99) 99999-9999">
                </div>
                          
                <button id="entrar-btn" type="submit" class="btn btn-sm mb-2">Criar Conta</button>
                <div class="leva-cadastro"> 
                    <button type="button" id="levacadastro-btn" class="btn btn-link btn-sm p-0" data-bs-target="#loginModal" data-bs-toggle="modal">Faça login</button>
                </div>  
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>


    <br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br>

    <script src="../assets/js/scroll.js"></script>

</html>
