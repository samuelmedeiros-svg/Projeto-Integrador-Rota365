<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="authors" content="Samuel Marques Medeiros, Arthur Chaves Macedo">

    <meta name="description" content="Página de contato">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato - Rota365</title>

    
    <link rel="stylesheet" href="../assets/css/header.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        .contato-container {
            max-width: 800px;
            margin: 50px auto;
            padding: 30px;
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .contato-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .contato-header h1 {
            color: #333333;
            margin-bottom: 10px;
        }

        .contato-header p {
            color: #666666;
        }

        .contato-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .contato-form input, 
        .contato-form textarea {
            width: 100%;
            padding: 15px;
            border: 1px solid #cccccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 16px;
        }

        .contato-form textarea {
            resize: vertical;
            min-height: 150px;
        }

        .contato-form button {
            background-color: #ff6600;
            color: #ffffff;
            padding: 15px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .contato-form button:hover {
            background-color: #e65c00;
        }
        
        .mensagem-sucesso {
            text-align: center;
            padding: 40px 20px;
        }
        
        .mensagem-sucesso h2 {
            color: #28a745;
            margin-bottom: 20px;
        }
        
        .mensagem-sucesso p {
            font-size: 18px;
            color: #333333;
            margin-bottom: 40px;
            line-height: 1.5;
        }
        
        .btn-voltar {
            background-color: #ff6600;
            color: #ffffff;
            padding: 15px 30px;
            text-decoration: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            display: inline-block;
            transition: background-color 0.3s;
        }
        
        .btn-voltar:hover {
            background-color: #e65c00;
        }
    </style>
</head>

<body>

        <div class="container">

            </div>
            <form class="contato-form" id="form-contato">

                <input type="email" name="email" placeholder="E-mail" required>
                <input type="text" name="telefone" placeholder="Telefone / WhatsApp (10 números)" pattern="[0-9]{10}" title="O telefone deve conter exatamente 10 números" maxlength="10" required>
                <input type="text" name="assunto" placeholder="Assunto" required>
                <textarea name="mensagem" placeholder="Escreva sua mensagem aqui..." required></textarea>
                <button type="submit">ENVIAR MENSAGEM</button>
            </form>
        </section>
    </main>

    <script src="../assets/js/scroll.js"></script>
</body>
</html>
