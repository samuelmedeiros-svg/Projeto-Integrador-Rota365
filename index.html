<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="authors" content="Samuel Marques Medeiros, Arthur Chaves Macedo">
    <meta name="reply-to" content="samuel.medeiros@estudante.iftm.edu.br">
    <meta name="description" content="home page">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rota365</title>
</head>
<style>
*{
    margin:0;
    padding-top:0;
    box-sizing:border-box;
}

body{
    font-family: Helvetica, Arial, sans-serif;
    background: #f9f9f9;
}

#header{
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 70px;
    background: #fff;
    display: flex;
    align-items: center;
    transition: all .4s ease;
    box-shadow: #000 10px;
    z-index: 3;
}

#header.scroll{
    height: 70px;
    background: rgba(0, 0, 0, 0.95);
    backdrop-filter: blur(10px);
    box-shadow: #000 10px;
}

#header .container{
    width:100%;
    height:100%;
    position:relative;
}

#header nav{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%, -50%);
    display:flex;
    gap:40px;
    scale: 90%;
}

#header nav a{
    color:#000;
    text-decoration:none;
    font-weight:600;
    transition:.3s;
}

#header nav a:hover{
    color:#ff7a00;
    cursor: pointer;
}

#header.scroll nav a{
    color:#ffffff;
}
#header.scroll nav a:hover{
    color:#ff7a00;
}



#header.scroll{
    background:rgba(0, 0, 0, 0.767);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
}

#header.scroll h2,

#header.scroll nav a{
    color:#fff;
}
main{
    padding-top: 70px;
}
.banner{
    width: 100%;
    height: 300px;
    margin-top: 70px;
    background-image: url("assets/images/banner.png");
    background-size: cover;
    background-position: center;
    display: flex;
    align-items: center;
    padding-left: 8%;
    position: relative;
}

.banner img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:flex;
}
.logo{
    position:absolute;
    left:20px;
    top:55%;
    transform:translateY(-50%);
}

.logo img{
    width:150px;
    height:auto;
    display:block;
}
.profile{
    position: absolute;
    right: 20px;
    top: 50%;
    transform: translateY(-50%);
    transition: .3s;
    cursor: pointer;
}
.profile img{
    width: 35px;
    height: auto;
    display: block;
}
.lupa{
    position: absolute;
    right: 80px;
    top: 52%;
    transform: translateY(-50%);
}
.lupa img{
    width: 24px;
    height: auto;
    display: flex;;
}

.vantagens{
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 30px;
    padding: 20px 0;
    background-color: #b9b9b9;
    height: 70px;
}
.card{
    width: 220px;
    height: 55px;
    background: #fff;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    transition: transform 0.3s ease-in-out;
}

.card img{
    width: 26px;
    height: 26px;
    left: 5px;
}

.card span{
    font-size: 15px;
    font-weight: 600;
    color: #000;
}

.card:hover{
    transform: scale(1.07);
}
.alugar{
    position: absolute;
    top: 70%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 650px;
    height: 155px;
    background: #fff;
    border-radius: 18px;
    box-shadow: 0 5px 20px rgba(0, 0, 0, 0.534);
    padding: 20px;
    display: flex;
    flex-direction: column;
    justify-content: center;
}

.campos-row{
    display: flex;
    gap: 20px;
}

.campos-row .campo{
    flex: 1;
}
.campo{
    height: auto;
    width: auto;
} 

.campo label{
    justify-content: center;
    display:flex;
    font-size:13px;
    font-weight:700;
    margin-bottom:8px;
}

.campo select,
.campo input{
    width:100%;
    height: 25px;
    border:1px solid #727272;
    border-radius:10px;
    padding:3px 3px;
    font-size:13px;
    outline:none;
    margin-bottom:5px;
}

.linha{

    display:flex;
    gap: 5px;
}
.linha input{
    flex: 1;
}

.buscar{
    height: auto;
    width: auto;
    margin-top: 10px;
    text-align:center;
}

.buscar button{
    background:#ff6f00;
    color:#fff;
    border:none;
    border-radius:30px;
    padding:8px 40px;
    font-size:14px;
    font-weight:bold;
    cursor:pointer;
    transition: transform 0.3s ease-in-out;
}

.buscar button:hover{
    background:#e65f00;
    transform: scale(1.02);
}
    

</style>

<body>
    <header id="header">
        <div class="container">
            <div class="logo">
            <a href="index.html">
                <img src="assets/images/logo.png" alt="logo" width="150" id="logo">
            </a>
            </div>
            <nav>
                <a href="index.html">Início</a>
                <a href="#">Frota365</a>
                <a href="#">365hub</a>
                <a href="#">Reservas</a>
                <a href="#">Contato</a>
                <a href="#">Ajuda</a>
            </nav>
            <div class="profile">
                <a href="#">
                    <img src="assets/images/profile.png" alt="profile" id="profile">
                </a>
            </div>
            <div class="lupa">
                <a href="#">
                    <img src="assets/images/lupa.png" alt="lupa" id="lupa">
                </a>
            </div>
        </div>
    </header>

    
<section class="banner">
<div class="alugar">
    <div class="campos-row">
        <div class="campo">
            <label>Retirada</label>
            <select>
                <option>GRU - Guarulhos Airport</option>
                <option>Congonhas</option>
                <option>Campinas</option>
            </select>
            <div class="linha">
                <input type="date">
                <input type="time">
            </div>
        </div>
        <div class="campo">
            <label>Devolução</label>
            <select>
                <option>GRU - Guarulhos Airport</option>
                <option>Congonhas</option>
                <option>Campinas</option>
            </select>
            <div class="linha">
                <input type="date">
                <input type="time">
            </div>
        </div>
        <div class="campo">
            <label>Tipo de veículo</label>
            <select>
                <option>Todos</option>
                <option>Econômico</option>
                <option>Sedan</option>
                <option>SUV</option>
                <option>Pickup</option>
                <option>Elétrico</option>
            </select>
            <select>
                <option>Mais filtros</option>
                <option>Automático</option>
                <option>Manual</option>
                <option>7 lugares</option>
            </select>
        </div>
    </div>
    <div class="buscar">
        <button>BUSCAR VEÍCULOS</button>
    </div>
</div>
</section>
    <section class="vantagens">
        <div class="card">
            <img src="assets/images/atendimento.png" alt="atendimento">
            <span>Atendimento 24h</span>
        </div>
        <div class="card">
            <img src="assets/images/like.png" alt="like">
            <span>Reserve rápido</span>
        </div>
        <div class="card">
            <img src="assets/images/car.png" alt="carro">
            <span>Maior variedade</span>
        </div>
    </section>
    <main>   
        <section style="height:2000px;"></section>
    </main>
    <script src="assets/js/scroll.js"></script>
</body>
</html>
