<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Componente de Filtro</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    
    <style>
        /* Fundo cinza apenas para destacar o card branco na tela */
        body {
            background-color: #e9ecef;
            padding: 40px;
            display: flex;
            justify-content: left;
        }

        /* Container Principal do Filtro */
        .filter-card {
            width: 100%;
            max-width: 320px;
            border-radius: 15px;
            border: none;
            background-color: #fff;
        }

        /* Estilo do Título (Laranja) */
        .text-brand {
            color: #ff5a00;
            letter-spacing: 0.5px;
        }

        /* Sobrescrevendo o Accordion do Bootstrap */
        .accordion-item {
            border: none;
            border-bottom: 1.5px solid #dcdcdc; /* Linhas separadoras */
            border-radius: 0 !important;
            background-color: transparent;
        }
        
        /* Botões de abrir/fechar categorias */
        .accordion-button {
            padding: 15px 0;
            font-weight: 700;
            font-size: 1.1rem;
            color: #000;
            background-color: transparent !important;
            box-shadow: none !important;
        }
        
        .accordion-button:not(.collapsed) {
            color: #000; /* Mantém a cor preta quando aberto */
        }
        
        /* Remove o padding lateral do conteúdo interno */
        .accordion-body {
            padding: 0 0 15px 0;
        }

        /* Customizando os Radio Buttons para ficarem com a borda laranja */
        .custom-radio {
            width: 22px;
            height: 22px;
            border: 2px solid #ff5a00;
            cursor: pointer;
        }
        
        .custom-radio:checked {
            background-color: #ff5a00;
            border-color: #ff5a00;
        }

        .custom-label {
            font-weight: 500;
            cursor: pointer;
            margin-left: 8px;
            font-size: 0.95rem;
        }
        
        /* Alinhamento dos itens da lista */
        .filter-option {
            margin-bottom: 12px;
            display: flex;
            align-items: center;
        }
    </style>
</head>
<body>

    <!-- Início do Card de Filtro -->
    <div class="card filter-card shadow-sm p-4">
        
        <!-- Cabeçalho: Título e Ícone -->
        <div class="d-flex justify-content-between align-items-center mb-1 pb-2" style="border-bottom: 1.5px solid #a9a9a9;">
            <h4 class="text-brand fw-bold mb-0">FILTRAR</h4>
            <i class="bi bi-funnel fs-4"></i>
        </div>

        <!-- Início do Accordion -->
        <div class="accordion" id="accordionFiltros">
            
            <!-- Item 1: Categoria (Aberto por padrão) -->
            <div class="accordion-item">
                <h2 class="accordion-header">
                    <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#collapseCategoria" aria-expanded="true">
                        Categoria
                    </button>
                </h2>
                <!-- Adicione a classe 'show' para iniciar aberto -->
                <div id="collapseCategoria" class="accordion-collapse collapse show" data-bs-parent="#accordionFiltros">
                    <div class="accordion-body">
                        
                        <div class="filter-option">
                            <input class="form-check-input custom-radio" type="radio" name="categoria" id="cat-economico">
                            <label class="form-check-label custom-label" for="cat-economico">Econômico</label>
                        </div>
                        <div class="filter-option">
                            <input class="form-check-input custom-radio" type="radio" name="categoria" id="cat-sedan">
                            <label class="form-check-label custom-label" for="cat-sedan">Sedan</label>
                        </div>
                        <div class="filter-option">
                            <input class="form-check-input custom-radio" type="radio" name="categoria" id="cat-suv">
                            <label class="form-check-label custom-label" for="cat-suv">SUV</label>
                        </div>
                        <div class="filter-option">
                            <input class="form-check-input custom-radio" type="radio" name="categoria" id="cat-familia">
                            <label class="form-check-label custom-label" for="cat-familia">Familia</label>
                        </div>
                        <div class="filter-option mb-0">
                            <input class="form-check-input custom-radio" type="radio" name="categoria" id="cat-outros">
                            <label class="form-check-label custom-label" for="cat-outros">Outros</label>
                        </div>

                    </div>
                </div>
            </div>

            <!-- Item 2: Marca -->
            <div class="accordion-item">
                <h2 class="accordion-header">
                    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseMarca" aria-expanded="false">
                        Marca
                    </button>
                </h2>
                <div id="collapseMarca" class="accordion-collapse collapse" data-bs-parent="#accordionFiltros">
                    <div class="accordion-body">
                        <!-- Conteúdo de Marca aqui -->
                        <p class="text-muted small mb-0">Opções de marca...</p>
                    </div>
                </div>
            </div>

            <!-- Item 3: Transmissão -->
            <div class="accordion-item">
                <h2 class="accordion-header">
                    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseTransmissao" aria-expanded="false">
                        Transmissão
                    </button>
                </h2>
                <div id="collapseTransmissao" class="accordion-collapse collapse" data-bs-parent="#accordionFiltros">
                    <div class="accordion-body">
                         <p class="text-muted small mb-0">Opções de transmissão...</p>
                    </div>
                </div>
            </div>

            <!-- Item 4: Combustível -->
            <div class="accordion-item">
                <h2 class="accordion-header">
                    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseCombustivel" aria-expanded="false">
                        Combustível
                    </button>
                </h2>
                <div id="collapseCombustivel" class="accordion-collapse collapse" data-bs-parent="#accordionFiltros">
                    <div class="accordion-body">
                        <p class="text-muted small mb-0">Opções de combustível...</p>
                    </div>
                </div>
            </div>

            <!-- Item 5: Preço -->
            <div class="accordion-item">
                <h2 class="accordion-header">
                    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapsePreco" aria-expanded="false">
                        Preço
                    </button>
                </h2>
                <div id="collapsePreco" class="accordion-collapse collapse" data-bs-parent="#accordionFiltros">
                    <div class="accordion-body">
                        <p class="text-muted small mb-0">Filtro de preço...</p>
                    </div>
                </div>
            </div>

            <!-- Item 6: Características -->
            <div class="accordion-item">
                <h2 class="accordion-header">
                    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseCaracteristicas" aria-expanded="false">
                        Caraterísticas
                    </button>
                </h2>
                <div id="collapseCaracteristicas" class="accordion-collapse collapse" data-bs-parent="#accordionFiltros">
                    <div class="accordion-body">
                        <p class="text-muted small mb-0">Opções de características...</p>
                    </div>
                </div>
            </div>

        </div>
        <!-- Fim do Accordion -->
    </div>

    <!-- Bootstrap JS (Necessário para a animação do clique abrir/fechar) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
