<div class="topbar topbar-acao">
    <div>
        <h2 class="saudacao">Clientes</h2>
        <p class="subtitulo">Gerencie o cadastro de clientes da locadora.</p>
    </div>
    <button type="button" class="btn btn-primario" id="btn-adicionar-cliente">+ Adicionar Cliente</button>
</div>

<div class="cards-container">
    <div class="card">
        <div class="card-title">Total de Clientes</div>
        <div class="card-number" id="card-total-clientes">0</div>
    </div>
    <div class="card">
        <div class="card-title">Clientes Ativos</div>
        <div class="card-number" id="card-clientes-ativos">0</div>
    </div>
    <div class="card">
        <div class="card-title">Clientes Bloqueados</div>
        <div class="card-number" id="card-clientes-bloqueados">0</div>
    </div>
    <div class="card destaque">
        <div class="card-title">Novos este mês</div>
        <div class="card-number" id="card-clientes-novos">0</div>
    </div>
</div>

<div class="filtros-container">
    <div class="filtros-titulo">Filtrar clientes</div>
    <div class="filtros-grid filtros-3">
        <div class="filtro-grupo">
            <label for="filtro-busca-cliente">Nome, CPF ou e-mail</label>
            <input type="text" id="filtro-busca-cliente" placeholder="Buscar cliente...">
        </div>
        <div class="filtro-grupo">
            <label for="filtro-status-cliente">Status</label>
            <select id="filtro-status-cliente">
                <option value="">Todos</option>
                <option value="ativo">Ativo</option>
                <option value="inativo">Inativo</option>
                <option value="bloqueado">Bloqueado</option>
            </select>
        </div>
        <div class="filtro-grupo">
            <label for="filtro-cnh-cliente">CNH</label>
            <select id="filtro-cnh-cliente">
                <option value="">Todas</option>
                <option value="valida">Válida</option>
                <option value="vencida">Vencida</option>
            </select>
        </div>
    </div>
    <div class="filtros-acoes">
        <button type="button" class="btn btn-primario btn-sm" id="btn-filtrar-clientes">Filtrar</button>
        <button type="button" class="btn btn-secundario btn-sm" id="btn-limpar-clientes">Limpar</button>
    </div>
</div>

<div class="tabela-container">
    <div class="tabela-header">
        <div class="tabela-titulo">Lista de Clientes</div>
    </div>
    <div class="tabela-card">
        <table>
            <thead>
                <tr>
                    <th>Cliente</th>
                    <th>CPF</th>
                    <th>Contato</th>
                    <th>CNH</th>
                    <th>Locações</th>
                    <th>Status</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="clientes-tbody"></tbody>
        </table>
    </div>
    <div class="paginacao" id="clientes-paginacao"></div>
</div>

<!-- Modal: visualizar cliente -->
<div class="modal-overlay oculto" id="modal-cliente">
    <div class="modal-caixa">
        <div class="modal-header">
            <h3>Detalhes do Cliente</h3>
            <button type="button" class="modal-fechar" id="modal-cliente-fechar">&times;</button>
        </div>
        <div id="modal-cliente-corpo"></div>
    </div>
</div>

<!-- Modal: adicionar / editar cliente -->
<div class="modal-overlay oculto" id="modal-form-cliente">
    <div class="modal-caixa">
        <div class="modal-header">
            <h3 id="modal-form-cliente-titulo">Adicionar Cliente</h3>
            <button type="button" class="modal-fechar" id="modal-form-cliente-fechar">&times;</button>
        </div>
        <form id="form-cliente">
            <input type="hidden" id="cf-id">
            <div class="modal-secao">
                <div class="modal-secao-titulo">Dados pessoais</div>
                <div class="filtros-grid" style="grid-template-columns: repeat(2, 1fr); margin-bottom: 0;">
                    <div class="filtro-grupo">
                        <label for="cf-nome">Nome completo</label>
                        <input type="text" id="cf-nome" required>
                    </div>
                    <div class="filtro-grupo">
                        <label for="cf-cpf">CPF</label>
                        <input type="text" id="cf-cpf" placeholder="000.000.000-00" required>
                    </div>
                    <div class="filtro-grupo">
                        <label for="cf-nascimento">Data de nascimento</label>
                        <input type="date" id="cf-nascimento">
                    </div>
                    <div class="filtro-grupo">
                        <label for="cf-cnh">Número da CNH</label>
                        <input type="text" id="cf-cnh">
                    </div>
                    <div class="filtro-grupo">
                        <label for="cf-cnh-validade">Validade da CNH</label>
                        <input type="date" id="cf-cnh-validade">
                    </div>
                    <div class="filtro-grupo">
                        <label for="cf-status">Status</label>
                        <select id="cf-status">
                            <option value="ativo">Ativo</option>
                            <option value="inativo">Inativo</option>
                            <option value="bloqueado">Bloqueado</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="modal-secao">
                <div class="modal-secao-titulo">Contato</div>
                <div class="filtros-grid" style="grid-template-columns: repeat(2, 1fr); margin-bottom: 14px;">
                    <div class="filtro-grupo">
                        <label for="cf-telefone">Telefone</label>
                        <input type="text" id="cf-telefone" placeholder="(00) 00000-0000" required>
                    </div>
                    <div class="filtro-grupo">
                        <label for="cf-email">E-mail</label>
                        <input type="email" id="cf-email" required>
                    </div>
                </div>
                <div class="filtro-grupo">
                    <label for="cf-endereco">Endereço</label>
                    <input type="text" id="cf-endereco" placeholder="Rua, número, bairro, cidade - UF">
                </div>
            </div>
            <div class="filtros-acoes" style="justify-content: flex-end; margin-top: 4px;">
                <button type="button" class="btn btn-secundario" id="modal-form-cliente-cancelar">Cancelar</button>
                <button type="submit" class="btn btn-primario">Salvar</button>
            </div>
        </form>
    </div>
</div>
